<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winter Supper at the Cabin</title>
  <meta name="description" content="A weekend of friends, family, and a long table of good food.">
  <meta property="og:title" content="Winter Supper at the Cabin">
  <meta property="og:description" content="A weekend of friends, family, and a long table of good food.">
  <meta property="og:image" content="assets/hero.jpg">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>

    header.site { position: absolute; left: 0; right: 0; background: linear-gradient(180deg, rgb(10 18 20 / 55%), transparent); border: 0; backdrop-filter: none; z-index: 20; }
    header.site .inner { max-width: 1280px; padding: 20px 24px; }
    header.site .brand { color: var(--linen); font: italic 400 1.2rem var(--display); display: block !important; }
    #nav { margin-left: auto; }
    #nav a { color: rgb(246 240 230 / 88%); text-shadow: 0 1px 8px rgb(0 0 0 / 35%); }
    #nav a[data-page="index"], #nav a[data-page="guests"], #nav a[data-page="trips"], #nav a[data-page="details"], #nav a[data-page="rsvp"] { display: none; }

    /* Hero: the real deck footage, full-bleed, then the lights come on. */
    .hero { position: relative; display: grid; align-items: end; min-height: 100svh; background: var(--pine); color: var(--linen); overflow: hidden; }
    .window { position: absolute; inset: 0; margin: 0; width: auto; }
    .window .night { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; transform-origin: 62% 38%; animation: drift 60s ease-out forwards; }
    @keyframes drift { from { transform: scale(1.001); } to { transform: scale(1.07); } }
    .window::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(180deg, rgb(8 16 20 / 55%) 0%, rgb(8 16 20 / 0%) 14%),
      radial-gradient(80% 70% at 0% 100%, rgb(10 26 26 / 88%) 0%, rgb(10 26 26 / 45%) 45%, transparent 75%); }
    .lede { position: relative; z-index: 2; padding: 0 clamp(24px, 6vw, 104px) clamp(120px, 20vh, 200px); max-width: 1280px; }
    #hello { color: var(--glow-2); margin: 0 0 20px; }
    .hero h1 { font-weight: 300; font-size: clamp(4rem, 10vw, 10rem); line-height: .86; letter-spacing: -.04em; margin: 0 0 32px; text-shadow: 0 2px 30px rgb(10 20 20 / 50%); }
    .hero h1 em { display: block; font-style: italic; font-weight: 400; color: var(--glow-2); }
    .hero .meta { display: grid; gap: 6px; margin: 0 0 36px; font: 600 .8rem var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--frost); }
    .hero .actions { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
    .hero #cta { background: var(--glow); border-color: var(--glow); color: #1b140a; padding: 17px 36px; border-radius: 2px; font: 600 .76rem var(--body); letter-spacing: .16em; text-transform: uppercase; }

    main { max-width: none; padding: 0; }
    .card { background: var(--pine-2); border-color: var(--hair); box-shadow: none; color: var(--linen); }
    #status { max-width: 1132px; margin: 56px auto 0; border-color: var(--glow); }
    #status .btn { background: var(--glow); border-color: var(--glow); color: #1b140a; }
    .muted { color: var(--mist); }

    /* The weekend: the schedule carries the facts. */
    .weekend { padding-top: var(--gap); display: grid; grid-template-columns: 5fr 7fr; gap: 40px clamp(32px, 6vw, 96px); align-items: start; }
    .weekend h2, .house h2 { font-weight: 300; font-size: clamp(2.4rem, 5vw, 3.8rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 24px; }
    #desc { font: 400 1.25rem/1.55 var(--display); color: rgb(246 240 230 / 82%); max-width: 52ch; margin: 0; }
    .days { border-top: 1px solid var(--hair); margin-top: 16px; }
    .day { display: grid; grid-template-columns: 11rem 1fr; column-gap: 24px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--hair); }
    .day .num { grid-row: 1 / 3; font: 300 clamp(4.4rem, 7vw, 6.6rem)/.9 var(--display); letter-spacing: -.05em; }
    .day .dow { color: var(--mist); }
    .day p { margin: 4px 0 0; font: 400 1.1rem var(--display); }
    .day p span { display: block; color: var(--mist); font: 400 1rem/1.5 var(--display); margin-top: 4px; }
    .more-about { margin: 18px 0 0; color: var(--mist); }
    .more-about summary { cursor: pointer; width: fit-content; color: var(--linen); font: 400 1rem var(--display); list-style: none; text-decoration: underline; text-decoration-color: rgb(246 240 230 / 35%); text-underline-offset: 5px; }
    .more-about summary::-webkit-details-marker { display: none; }
    .more-about p { margin: 12px 0 0; font: 400 1rem/1.6 var(--display); max-width: 48ch; }

    .weekend, .house { margin-top: var(--gap); }
    .weekend { padding-top: 0 !important; grid-template-columns: 1fr !important; }
    .house { display: grid; grid-template-columns: minmax(0, 480px) 1fr; gap: clamp(32px, 7vw, 112px); align-items: center; }
    .spec h2 { margin-top: 0; }
    .bleed { margin: 0; }
    .bleed img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; border-radius: 3px; }
    .stats span { white-space: nowrap; }
    .stats { font: 600 .76rem/1.9 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--frost); margin: 0 0 20px; }
    .blurb { font: 400 1.12rem/1.55 var(--display); color: var(--mist); max-width: 40ch; margin: 0; }

    /* Finale */
    .finale { max-width: 1180px; margin: var(--gap) auto 0; padding: 0 24px; }
    .finale-in { padding-top: var(--gap); border-top: 1px solid var(--hair); }
    .finale-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: clamp(32px, 7vw, 112px); align-items: stretch; }
    .lamp { margin: 0; position: relative; min-height: 420px; }
    .lamp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 3px; }
    .finale h2 { font-weight: 300; font-size: clamp(2.4rem, 4.4vw, 3.6rem); letter-spacing: -.03em; line-height: 1; margin: 0; }
    .finale p.sub { font: 400 1.18rem/1.55 var(--display); color: var(--mist); margin: 20px 0 var(--s2); max-width: 44ch; }
    .reply .answers { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid rgb(246 240 230 / 35%); border-radius: 2px; }
    .reply .answers label { position: relative; margin: 0; font-weight: 400; }
    .reply .answers label + label { border-left: 1px solid rgb(246 240 230 / 35%); }
    .reply .answers input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
    .reply .answers span { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 10px; font: 600 .76rem var(--body); letter-spacing: .16em; text-transform: uppercase; text-align: center; cursor: pointer; color: rgb(246 240 230 / 75%); }
    .reply .answers span:hover { color: var(--linen); }
    .reply .answers input:checked + span { background: var(--linen); color: var(--pine); }
    .reply .answers input:focus-visible + span { outline: 2px solid var(--glow); outline-offset: -4px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 24px; align-items: end; margin-top: 28px; }
    .count { display: grid; gap: 4px; margin: 0; font: 600 .7rem var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--mist); }
    .count input { width: 100%; min-height: 44px; background: transparent; border: 0; border-bottom: 1px solid rgb(246 240 230 / 40%); border-radius: 0; color: var(--linen); font: 400 1.4rem var(--display); padding: 4px 0; }
    .count input:focus-visible { outline: none; border-bottom-color: var(--glow); }
    .reply button { min-height: 54px; border: 0; border-radius: 2px; background: var(--glow); color: #1b140a; font: 600 .76rem var(--body); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
    .fine { color: var(--mist); font: 400 1rem var(--display); margin: 18px 0 0; }
    .note { min-height: 1.5em; margin: 10px 0 0; color: var(--glow-2); }
    footer.end { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; max-width: 1180px; margin: 96px auto 0; padding: 0 24px 44px; color: var(--mist); font: italic 400 1rem var(--display); }
    .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; width: 100%; padding-top: 24px; border-top: 1px solid var(--hair); }

    @media (max-width: 900px) {
      .lede { padding: 0 24px 48px; }
      .hero h1 { font-size: clamp(3.3rem, 14vw, 6rem); }
      .weekend { grid-template-columns: 1fr; }
      .house, .finale-grid { grid-template-columns: 1fr; }
      .bleed, .lamp { max-width: 440px; }
    }
    @media (max-width: 560px) {
      header.site .inner { padding: 14px 16px; }
      #nav { display: none; }
      .lede { padding-bottom: 72px !important; }
      .wrap { padding-left: 16px; padding-right: 16px; }
      .lede { padding: 0 16px 40px; }
      .hero h1 { font-size: clamp(3.8rem, 18.5vw, 5rem); line-height: .88; }
      .hero .meta { font-size: .72rem; margin-bottom: 24px; }
      .window .night { object-position: 30% 38%; }
      .day { grid-template-columns: 5.5rem 1fr; column-gap: 12px; }
      .day .num { font-size: 3.6rem; }
      .lamp { min-height: 0; }
      .lamp img { position: static; aspect-ratio: 4 / 5; height: auto; }
      .house, .finale-grid { grid-template-columns: 1fr; }
      .finale { padding: 0 16px; }
      footer.end { padding: 0 16px 36px; }
      .row2 { grid-template-columns: 1fr 1fr; }
      .reply button { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) { .window .night { animation: none; } }
  </style>
</head>
<body>
  <header class="site"><div class="inner"><a class="brand" href="index.html">&nbsp;</a>
    <nav id="nav"><a href="index.html" aria-current="page">Invite</a><a href="house.html">The house</a><a href="rsvp.html">RSVP</a><a href="details.html">Details</a><a href="menu.html">The menu</a><a href="guests.html">Guests</a><a href="trips.html">Day trips</a></nav>
  </div></header>

  <section class="hero">
    <div class="lede">
      <p class="sc" id="hello" hidden>You're invited</p>
      <h1 id="title">&nbsp;</h1>
      <p class="meta"><span id="when"></span><span id="where"></span><span id="stay"></span></p>
      <div class="actions"><a class="btn" id="cta" href="#reply">RSVP</a></div>
    </div>
    <figure class="window">
      <img class="night" id="hero-img" alt="">
    </figure>
  </section>

  <main>
    <section class="card" id="status" hidden></section>

    <section class="weekend wrap">
      <div>
        <h2 id="nick">The weekend</h2>
        <p id="desc"></p>
        <details class="more-about"><summary>Read the full plan</summary><p id="full"></p></details>
      </div>
      <div id="daysWrap">
        <div class="days" id="days"></div>
      </div>
    </section>

    <section class="house wrap" id="houseSec">
      <figure class="bleed"><img id="feature-img" alt=""></figure>
      <div class="spec">
        <h2>The house</h2>
        <p class="stats" id="stats"></p>
        <p class="blurb"><span id="blurb"></span> <a class="more" href="house.html" data-link>See the whole house</a></p>
      </div>
    </section>
  </main>

  <section class="finale"><div class="finale-in">
    <div class="finale-grid">
    <div class="reply-col">
      <h2 id="reply-title"></h2>
      <p class="sub" id="reply-sub"></p>
      <form class="reply" id="reply">
        <div class="answers" role="radiogroup" aria-label="Will you make it?">
          <label><input type="radio" name="status" value="yes" required><span>Yes</span></label>
          <label id="maybeOpt"><input type="radio" name="status" value="maybe"><span>Maybe</span></label>
          <label><input type="radio" name="status" value="no"><span>No</span></label>
        </div>
        <div class="row2">
          <label class="count">Adults <input type="number" name="adults" min="1" max="20" value="1" inputmode="numeric"></label>
          <label class="count" id="kidsWrap">Kids <input type="number" name="kids" min="0" max="20" value="0" inputmode="numeric"></label>
          <button type="submit">Send RSVP</button>
        </div>
        <p class="fine">Want a room, or a reminder closer to the day? <a class="more" href="rsvp.html" data-link>Add the details</a></p>
        <p class="note" id="note" role="status"></p>
      </form>
    </div>
    <figure class="lamp" id="lampFig"><img id="evening-img" alt=""></figure>
    </div>
  </div></section>
  <footer class="end"><div class="foot">
    <span id="foot-title"></span><span id="foot-when"></span></div>
  </footer>

  <script src="app.js"></script>
  <script>
    // All invite copy comes from event.json.
    function renderInvite(ev) {
      const { $, esc } = App;
      const text = (id, v) => ($('#' + id).textContent = v || '');
      const img = (id, im) => Object.assign($('#' + id), { src: im.src, alt: im.alt });
      const lead = ev.title_em && ev.title.endsWith(ev.title_em) ? ev.title.slice(0, -ev.title_em.length).trim() : ev.title;
      $('#title').innerHTML = esc(lead) + (lead !== ev.title ? ` <em>${esc(ev.title_em)}</em>` : '');
      text('when', ev.when_text); text('where', ev.area); text('stay', ev.stay_text);
      text('desc', ev.intro); text('full', ev.description);
      text('reply-title', ev.reply.title); text('reply-sub', ev.reply.sub);
      img('hero-img', ev.images.hero);
      const o = App.rsvpOpts(ev);
      $('#maybeOpt').hidden = !o.maybe;
      $('#kidsWrap').hidden = !o.kids;
      const showHouse = App.on(ev, 'place') && ev.house;
      $('#houseSec').hidden = !showHouse;
      if (showHouse) {
        text('blurb', ev.house.blurb);
        $('#stats').innerHTML = (ev.house.stats || []).map((x) => `<span>${esc(x)}</span>`).join(' · ');
      }
      // The photo columns collapse when there is no photo to put in them.
      $('#feature-img').closest('figure').hidden = !ev.images.feature;
      if (ev.images.feature) img('feature-img', ev.images.feature);
      $('#lampFig').hidden = !ev.images.evening;
      if (ev.images.evening) img('evening-img', ev.images.evening);
      $('#daysWrap').hidden = !(ev.schedule || []).length;
      const day = (d, o) => new Date(d + 'T12:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
      const main = ev.main.start.slice(0, 10);
      $('#days').innerHTML = (ev.schedule || []).map((s) => `
        <div class="day${s.date === main ? ' main' : ''}"><span class="num">${day(s.date, { day: 'numeric' })}</span>
          <span class="dow sc">${day(s.date, { weekday: 'long' })}</span>
          <p>${esc(s.title)}<span>${esc(s.text)}${s.link ? ` <a class="more" href="${esc(s.link.href)}" data-link>${esc(s.link.label)}</a>` : ''}</span></p></div>`).join('');
      text('foot-title', ev.title);
      text('foot-when', `${day(main, { weekday: 'long', month: 'long', day: 'numeric' })} · ${ev.area}`);
    }

    (async () => {
      const { $, esc } = App;
      renderInvite(await App.event());
      document.querySelectorAll('[data-link]').forEach((a) => (a.href = App.link(a.getAttribute('href'))));
      // The invite itself is public; only personalization needs a valid link.
      const me = await App.boot({ gate: false });
      const form = $('#reply');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!me) { $('#note').textContent = 'Open the personal link from your invitation to reply.'; return; }
        const f = new FormData(form);
        const g = me.guest;
        const rsvp = { status: f.get('status'), adults: f.get('adults'), kids: f.get('kids'), party_names: g.party_names, dietary: g.dietary, arrive: g.arrive,
          depart: g.depart, sleep: g.sleep, room_reason: g.room_reason, remind_email: g.remind_email, remind_text: g.remind_text };
        try {
          const out = await App.api('rsvp', { rsvp });
          Object.assign(me, out);
          $('#note').innerHTML = rsvp.status === 'yes' ? `You're in. <a class="more" href="${App.link('details.html')}">Get the address &amp; directions</a>` : rsvp.status === 'maybe' ? 'Got it. Update anytime.' : "Thanks for letting us know. We'll miss you!";
        } catch (err) { $('#note').textContent = err.message; }
      });
      if (!me) return;
      if (me.guest.status !== 'invited') {
        form.querySelector(`[name=status][value=${me.guest.status}]`).checked = true;
        form.adults.value = me.guest.adults || 1;
        form.kids.value = me.guest.kids || 0;
      }
      const g = me.guest;
      $('#hello').textContent = `${g.name.split(' ')[0]}, you're invited`;
      $('#hello').hidden = false;
      const label = { yes: "You're coming!", maybe: 'You said maybe', no: "You can't make it", invited: '' }[g.status];
      if (g.status !== 'invited') {
        $('#cta').textContent = 'Update your RSVP';
        $('#status').hidden = false;
        $('#status').innerHTML = `<h2>${esc(label)}</h2>` + (g.status === 'yes'
          ? `<p>The address, directions, and calendar links are unlocked.</p><a class="btn" href="${App.link('details.html')}">Get details</a>`
          : `<a class="btn ghost" href="${App.link('rsvp.html')}">Change RSVP</a>`);
      }
    })();
  </script>
</body>
</html>
