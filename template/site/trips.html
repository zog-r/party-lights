<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day trips · Winter Supper at the Cabin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site"><div class="inner"><a class="brand" href="index.html">&nbsp;</a><nav id="nav"></nav></div></header>
  <main>
    <div class="page-head"><p class="eyebrow">Community board</p>
      <h1>Day <em>trips</em></h1>
      <p id="intro"></p></div>
    <div id="trips" aria-live="polite"></div>
    <form class="card narrow" id="add">
      <h2>Propose a trip</h2>
      <label for="title">What</label>
      <input type="text" id="title" name="title" maxlength="80" required placeholder="e.g. Sunrise kayak">
      <label for="day">When</label>
      <select id="day" name="day"><option value="">Flexible</option></select>
      <label for="details">Details</label>
      <textarea id="details" name="details" maxlength="500" placeholder="Where, how long, what to bring"></textarea>
      <label class="check"><input type="checkbox" name="host"> I'll lead this one</label>
      <p class="actions"><button class="btn primary" type="submit">Post it</button></p>
    </form>
  </main>
  <script src="app.js"></script>
  <script>
    (async () => {
      const { $, esc } = App;
      const ev = await App.event();
      const me = await App.boot();
      if (!me) return;
      $('#intro').textContent = ev.trips_intro;
      $('#day').insertAdjacentHTML('beforeend', (ev.stay_days || []).map((d) => `<option>${esc(d.label)}</option>`).join(''));
      async function load() {
        const { trips } = await App.api('board');
        $('#trips').innerHTML = trips.map((t) => `
          <article class="card">
            <h3>${esc(t.title)} ${t.day ? `<span class="chip">${esc(t.day)}</span>` : ''}</h3>
            ${t.details ? `<p class="muted">${esc(t.details)}</p>` : ''}
            <p class="small-meta">${t.host ? `Led by <strong>${esc(t.host)}</strong>` : 'Needs a leader'}${t.proposer ? ` · proposed by ${esc(t.proposer)}` : ''}</p>
            ${t.joiners.length ? `<p>Going: ${t.joiners.map(esc).join(', ')}</p>` : ''}
            <div class="choices">
              ${t.hosting ? `<button class="btn ghost" data-op="unhost" data-id="${t.id}">Step down as leader</button>`
                : `${!t.host ? `<button class="btn" data-op="host" data-id="${t.id}">I'll lead</button>` : ''}
                   <button class="btn ${t.joined ? 'ghost' : ''}" data-op="${t.joined ? 'leave' : 'join'}" data-id="${t.id}">${t.joined ? 'Leave' : "I'm in"}</button>`}
            </div>
          </article>`).join('');
      }
      document.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-op]');
        if (!b) return;
        try { await App.api('trip', { id: b.dataset.id, op: b.dataset.op }); await load(); } catch (err) { App.toast(err.message); }
      });
      $('#add').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = e.target;
        try {
          await App.api('addTrip', { title: f.elements.title.value, details: f.details.value, day: f.day.value, host: f.host.checked });
          f.reset();
          App.toast('Posted!');
          await load();
        } catch (err) { App.toast(err.message); }
      });
      await load();
    })();
  </script>
</body>
</html>
